 
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Pop Adventure 2.0</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg,#9ee8d1,#c6e8ff,#ffd4e6);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    font-family: Fredoka, sans-serif;
}

.container {
    width: 1100px;
    max-width: 100%;
    background: #fff9e9;
    padding: 18px;
    border-radius: 28px;
    border: 6px solid white;
    box-shadow: 0 15px 40px #456b6040;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
}

.logo {
    font-size: clamp(21px,4vw,34px);
    font-weight: 700;
    color: #ff6695;
    text-shadow: 2px 3px white;
}

.stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.stat {
    background: white;
    color: #755c83;
    padding: 10px 14px;
    border-radius: 13px;
    box-shadow: 0 3px 8px #00000012;
    font-weight: 600;
}

.game-box {
    overflow: hidden;
    border: 5px solid white;
    border-radius: 20px;
    background: #b7eac0;
}

canvas {
    width: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 11px;
    flex-wrap: wrap;
    margin-top: 16px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 14px;
    background: #ff80a4;
    color: white;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 5px #d75b80;
    transition: .2s;
}

button:hover {
    transform: translateY(-3px);
    filter: brightness(1.07);
}

button:active {
    transform: translateY(2px);
}

.start {
    background: #51bf88;
    box-shadow: 0 5px #31966a;
}

.music {
    background: #8c7ee8;
    box-shadow: 0 5px #6155b5;
}

.help {
    text-align: center;
    color: #89758c;
    margin-top: 13px;
    line-height: 1.7;
    font-size: 14px;
}

@media(max-width:550px) {
    .container {padding: 9px}
    .stat {font-size: 12px;padding: 8px}
    button {font-size: 13px;padding: 10px 13px}
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🐸 BUBBLE POP ADVENTURE</div>

        <div class="stats">
            <div class="stat">⭐ <span id="score">0</span></div>
            <div class="stat">🎯 Level <span id="level">1</span></div>
            <div class="stat">🏆 <span id="best">0</span></div>
        </div>
    </div>

    <div class="game-box">
        <canvas id="game" width="1000" height="680"></canvas>
    </div>

    <div class="controls">
        <button class="start" onclick="startGame()">▶ MULAI GAME</button>
        <button onclick="togglePause()">⏸ PAUSE</button>
        <button onclick="startGame()">🔄 ULANGI</button>
        <button class="music" onclick="toggleMusic()" id="musicBtn">🎵 MUSIK ON</button>
        <button onclick="toggleEffects()" id="effectBtn">🔊 SOUND ON</button>
    </div>

    <div class="help">
        🐸 Gerakkan mouse untuk membidik kodok.
        <br>
        🎯 Klik untuk menembakkan bola. Cocokkan 3 warna yang sama!
        <br>
        🎵 Nikmati musik dan efek suara selama bermain!
    </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 1000;
const H = 680;

const COLORS = [
    "#ff5577",
    "#42a6ff",
    "#ffd447",
    "#a66cff",
    "#45d6a0",
    "#ff9846"
];

let score = 0;
let level = 1;
let best = 0;

let balls = [];
let bullets = [];
let particles = [];
let popups = [];

let running = false;
let paused = false;
let gameOver = false;
let won = false;

let musicOn = true;
let effectsOn = true;

let audio = null;
let musicTimer = null;
let musicIndex = 0;

let lastTime = 0;
let shotCooldown = 0;
let shotColor = 0;

const frog = {x:500,y:340};
const mouse = {x:700,y:340};

const R = 13;
const GAP = 28;
const BALL_SPEED = 30;

let path = [];
let lengths = [];
let totalLength = 0;

// ===================================
// AUDIO SYSTEM
// ===================================

function initAudio() {

    if(!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audio.state === "suspended") {
        audio.resume();
    }
}

function playTone(freq,duration,type="sine",volume=.06,delay=0) {

    if(!audio) return;

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = type;

    osc.frequency.setValueAtTime(
        freq,
        audio.currentTime+delay
    );

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime+delay
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+delay+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(audio.currentTime+delay);
    osc.stop(audio.currentTime+delay+duration);
}

// Musik original bergaya kartun
const melody = [
    523,659,784,659,
    587,698,880,698,
    523,659,784,1047,
    880,784,659,523,
    587,698,784,698,
    659,784,880,1047
];

function musicStep() {

    if(!musicOn || !running || paused) return;

    initAudio();

    const note = melody[musicIndex % melody.length];

    playTone(note,.23,"sine",.035);

    if(musicIndex % 4 === 0) {
        playTone(note/2,.3,"triangle",.025);
    }

    if(musicIndex % 8 === 0) {
        playTone(note*1.5,.12,"sine",.018);
    }

    musicIndex++;
}

function startMusic() {

    if(!musicOn || !running || paused) return;

    stopMusic();

    musicStep();

    musicTimer = setInterval(musicStep,260);
}

function stopMusic() {

    if(musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

function toggleMusic() {

    musicOn = !musicOn;

    document.getElementById("musicBtn").textContent =
        musicOn ? "🎵 MUSIK ON" : "🔇 MUSIK OFF";

    if(musicOn && running && !paused) {
        initAudio();
        startMusic();
    } else {
        stopMusic();
    }
}

function toggleEffects() {

    effectsOn = !effectsOn;

    document.getElementById("effectBtn").textContent =
        effectsOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";
}

function sound(freq,duration=.12) {

    if(!effectsOn) return;

    initAudio();
    playTone(freq,duration,"triangle",.07);
}

function shootSound() {
    sound(320,.09);
    sound(540,.08);
}

function popSound() {

    if(!effectsOn) return;

    [650,850,1100,1350].forEach((n,i)=>{
        playTone(n,.15,"sine",.07,i*.05);
    });
}

function praiseSound() {

    if(!effectsOn) return;

    [523,659,784,1047].forEach((n,i)=>{
        playTone(n,.2,"sine",.065,i*.09);
    });
}

// ===================================
// LONG PATH
// ===================================

function createPath() {

    // Jalur panjang berbentuk banyak kelokan
    const points = [
        [-40,105],
        [80,55],
        [230,75],
        [380,125],
        [540,75],
        [700,55],
        [880,100],
        [950,220],
        [900,310],
        [770,345],
        [620,300],
        [480,250],
        [320,280],
        [150,345],
        [60,430],
        [130,535],
        [270,575],
        [420,530],
        [560,470],
        [720,470],
        [880,520],
        [950,610],
        [850,655],
        [680,620],
        [520,650],
        [340,630],
        [170,660],
        [-40,620]
    ];

    path = [];

    for(let i=0;i<points.length-1;i++) {

        const p0=points[Math.max(0,i-1)];
        const p1=points[i];
        const p2=points[i+1];
        const p3=points[Math.min(points.length-1,i+2)];

        for(let j=0;j<24;j++) {

            const t=j/24;
            const t2=t*t;
            const t3=t2*t;

            const x=.5*(
                2*p1[0]+
                (-p0[0]+p2[0])*t+
                (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+
                (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3
            );

            const y=.5*(
                2*p1[1]+
                (-p0[1]+p2[1])*t+
                (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+
                (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3
            );

            path.push({x,y});
        }
    }

    path.push({
        x:points.at(-1)[0],
        y:points.at(-1)[1]
    });

    lengths=[0];

    for(let i=1;i<path.length;i++) {

        lengths[i]=lengths[i-1]+Math.hypot(
            path[i].x-path[i-1].x,
            path[i].y-path[i-1].y
        );
    }

    totalLength=lengths.at(-1);
}

function positionAt(d) {

    if(d<=0) return path[0];
    if(d>=totalLength) return path.at(-1);

    let low=0;
    let high=path.length-1;

    while(low<high) {

        const mid=(low+high)>>1;

        if(lengths[mid]<d) low=mid+1;
        else high=mid;
    }

    const i=low;

    const t=(d-lengths[i-1])/
        (lengths[i]-lengths[i-1]);

    return {
        x:path[i-1].x+(path[i].x-path[i-1].x)*t,
        y:path[i-1].y+(path[i].y-path[i-1].y)*t
    };
}

// ===================================
// BALLS
// ===================================

function randomColor() {
    return Math.floor(Math.random()*COLORS.length);
}

function makeBalls() {

    balls=[];

    const count=25+(level-1)*5;

    for(let i=0;i<count;i++) {

        let color=randomColor();

        if(i>0 && Math.random()<.35) {
            color=balls[i-1].color;
        }

        balls.push({
            d:i*GAP,
            color
        });
    }
}

function updateStats() {

    document.getElementById("score").textContent=score;
    document.getElementById("level").textContent=level;
    document.getElementById("best").textContent=best;
}

// ===================================
// GAME CONTROL
// ===================================

function startGame() {

    initAudio();

    score=0;
    level=1;

    bullets=[];
    particles=[];
    popups=[];

    running=true;
    paused=false;
    gameOver=false;
    won=false;

    shotColor=randomColor();

    makeBalls();
    updateStats();

    startMusic();
}

function togglePause() {

    if(gameOver || won || (!running && !paused)) return;

    paused=!paused;
    running=!paused;

    if(paused) stopMusic();
    else startMusic();
}

// ===================================
// CONTROLS
// ===================================

function updateMouse(e) {

    const rect=canvas.getBoundingClientRect();

    mouse.x=(e.clientX-rect.left)*W/rect.width;
    mouse.y=(e.clientY-rect.top)*H/rect.height;
}

canvas.addEventListener("pointermove",e=>{
    updateMouse(e);
});

canvas.addEventListener("pointerdown",e=>{

    updateMouse(e);

    if(!running || paused || gameOver || won) return;
    if(shotCooldown>0) return;

    initAudio();

    const angle=Math.atan2(
        mouse.y-frog.y,
        mouse.x-frog.x
    );

    bullets.push({
        x:frog.x,
        y:frog.y,
        vx:Math.cos(angle)*630,
        vy:Math.sin(angle)*630,
        color:shotColor
    });

    shotColor=randomColor();
    shotCooldown=.2;

    shootSound();
});

// ===================================
// EFFECTS
// ===================================

function explode(x,y,color) {

    for(let i=0;i<25;i++) {

        const angle=Math.random()*Math.PI*2;
        const force=65+Math.random()*230;

        particles.push({
            x,y,
            vx:Math.cos(angle)*force,
            vy:Math.sin(angle)*force,
            life:.9,
            max:.9,
            size:3+Math.random()*6,
            color
        });
    }
}

const compliments=[
    "AMAZING!",
    "GOOD JOB!",
    "EXCELLENT!",
    "AWESOME!",
    "PERFECT!",
    "SUPER!",
    "FANTASTIC!"
];

function addPopup(x,y,text) {

    popups.push({
        x,y,
        text,
        life:1.4,
        max:1.4
    });
}

// ===================================
// MATCH
// ===================================

function checkMatch(index) {

    if(index<0 || index>=balls.length) return false;

    const color=balls[index].color;

    let left=index;
    let right=index;

    while(left>0 && balls[left-1].color===color) left--;

    while(right<balls.length-1 &&
          balls[right+1].color===color) right++;

    const count=right-left+1;

    if(count<3) return false;

    const center=positionAt(balls[index].d);

    for(let i=left;i<=right;i++) {

        const p=positionAt(balls[i].d);
        explode(p.x,p.y,COLORS[color]);
    }

    balls.splice(left,count);

    score+=count*15;

    addPopup(
        center.x,
        center.y-30,
        compliments[Math.floor(Math.random()*compliments.length)]
    );

    if(count>=5) {
        score+=100;
        addPopup(center.x,center.y-80,"COMBO +100!");
    }

    best=Math.max(best,score);
    updateStats();

    popSound();
    praiseSound();

    if(left>0) checkMatch(left-1);

    return true;
}

// ===================================
// UPDATE
// ===================================

function update(dt) {

    if(!running || paused || gameOver || won) return;

    shotCooldown=Math.max(0,shotCooldown-dt);

    // Gerakan rangkaian bola
    balls.forEach(b=>{
        b.d+=BALL_SPEED*dt;
    });

    // Menjaga jarak bola
    for(let i=balls.length-2;i>=0;i--) {

        balls[i].d=Math.min(
            balls[i].d,
            balls[i+1].d-GAP
        );
    }

    // Peluru
    for(let i=bullets.length-1;i>=0;i--) {

        const b=bullets[i];

        b.x+=b.vx*dt;
        b.y+=b.vy*dt;

        let hit=-1;

        for(let j=0;j<balls.length;j++) {

            const p=positionAt(balls[j].d);

            if(Math.hypot(b.x-p.x,b.y-p.y)<28) {
                hit=j;
                break;
            }
        }

        if(hit!==-1) {

            let insertDistance=balls[hit].d;

            if(hit>0) {
                insertDistance=(
                    balls[hit-1].d+balls[hit].d
                )/2;
            }

            balls.splice(hit,0,{
                d:insertDistance,
                color:b.color
            });

            bullets.splice(i,1);

            checkMatch(hit);
            continue;
        }

        if(b.x<-30 || b.x>W+30 || b.y<-30 || b.y>H+30) {
            bullets.splice(i,1);
        }
    }

    // Partikel
    for(let i=particles.length-1;i>=0;i--) {

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vx*=.97;
        p.vy*=.97;
        p.life-=dt;

        if(p.life<=0) particles.splice(i,1);
    }

    // Popup
    for(let i=popups.length-1;i>=0;i--) {

        const p=popups[i];

        p.y-=40*dt;
        p.life-=dt;

        if(p.life<=0) popups.splice(i,1);
    }

    // Game over
    if(balls.length && balls[balls.length-1].d>=totalLength) {

        gameOver=true;
        running=false;
        stopMusic();

        sound(170,.5);
    }

    // Level
    if(balls.length===0) {

        if(level>=5) {

            won=true;
            running=false;
            stopMusic();

            [523,659,784,1047,1318].forEach((n,i)=>{
                if(effectsOn) playTone(n,.3,"sine",.08,i*.12);
            });

        } else {

            level++;

            makeBalls();
            addPopup(500,250,"LEVEL UP!");

            updateStats();
        }
    }
}

// ===================================
// BACKGROUND
// ===================================

function drawBackground() {

    const g=ctx.createLinearGradient(0,0,W,H);

    g.addColorStop(0,"#d8f7bd");
    g.addColorStop(1,"#a6e8d0");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    // Awan
    for(let i=0;i<7;i++) {

        const x=(i*173+60)%W;
        const y=30+(i%3)*28;

        ctx.fillStyle="#ffffff75";

        ctx.beginPath();
        ctx.arc(x,y,18,0,Math.PI*2);
        ctx.arc(x+19,y-8,23,0,Math.PI*2);
        ctx.arc(x+40,y,18,0,Math.PI*2);
        ctx.fill();
    }

    // Rumput dekoratif
    for(let i=0;i<48;i++) {

        const x=(i*137+30)%W;
        const y=(i*113+20)%H;

        ctx.fillStyle="#ffffff65";

        ctx.beginPath();
        ctx.arc(x,y,3+i%4,0,Math.PI*2);
        ctx.fill();
    }

    // Bunga dekoratif
    for(let i=0;i<18;i++) {

        const x=(i*197+45)%W;
        const y=(i*151+70)%H;

        ctx.fillStyle="#ff8eb5";

        for(let j=0;j<5;j++) {

            const a=j*Math.PI*2/5;

            ctx.beginPath();
            ctx.arc(
                x+Math.cos(a)*7,
                y+Math.sin(a)*7,
                5,0,Math.PI*2
            );
            ctx.fill();
        }

        ctx.fillStyle="#ffdc69";
        ctx.beginPath();
        ctx.arc(x,y,4,0,Math.PI*2);
        ctx.fill();
    }

    // Hiasan pohon di sudut
    for(const x of [22,970]) {

        ctx.fillStyle="#9a704d";
        ctx.fillRect(x-5,470,10,75);

        ctx.fillStyle="#68c98b";
        ctx.beginPath();
        ctx.arc(x,465,30,0,Math.PI*2);
        ctx.arc(x-18,480,22,0,Math.PI*2);
        ctx.arc(x+18,480,22,0,Math.PI*2);
        ctx.fill();
    }
}

// ===================================
// PATH
// ===================================

function drawPath() {

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.beginPath();

    path.forEach((p,i)=>{
        if(i===0) ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
    });

    ctx.strokeStyle="#82b67c";
    ctx.lineWidth=48;
    ctx.stroke();

    ctx.strokeStyle="#fff0ca";
    ctx.lineWidth=37;
    ctx.stroke();

    ctx.strokeStyle="#d6bd93";
    ctx.lineWidth=3;
    ctx.setLineDash([8,10]);
    ctx.stroke();

    ctx.setLineDash([]);
}

// ===================================
// BALL DRAW
// ===================================

function drawBall(x,y,color,r=R) {

    ctx.save();

    ctx.fillStyle="#00000020";

    ctx.beginPath();
    ctx.arc(x+2,y+4,r+1,0,Math.PI*2);
    ctx.fill();

    const g=ctx.createRadialGradient(
        x-r*.4,y-r*.5,2,
        x,y,r
    );

    g.addColorStop(0,"white");
    g.addColorStop(.25,COLORS[color]);
    g.addColorStop(1,"#51435d");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#ffffffcc";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x-r*.3,y-r*.35,r*.2,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

// ===================================
// FROG
// ===================================

function drawFrog() {

    const angle=Math.atan2(
        mouse.y-frog.y,
        mouse.x-frog.x
    );

    ctx.save();
    ctx.translate(frog.x,frog.y);

    // Bayangan
    ctx.fillStyle="#00000020";

    ctx.beginPath();
    ctx.ellipse(0,40,49,12,0,0,Math.PI*2);
    ctx.fill();

    // Kaki
    ctx.fillStyle="#258c5c";

    ctx.beginPath();
    ctx.ellipse(-29,23,17,11,-.3,0,Math.PI*2);
    ctx.ellipse(29,23,17,11,.3,0,Math.PI*2);
    ctx.fill();

    // Badan
    ctx.fillStyle="#38b879";

    ctx.beginPath();
    ctx.ellipse(0,7,39,34,0,0,Math.PI*2);
    ctx.fill();

    // Perut
    ctx.fillStyle="#b4f09e";

    ctx.beginPath();
    ctx.ellipse(0,15,23,20,0,0,Math.PI*2);
    ctx.fill();

    // Mata
    for(const side of [-1,1]) {

        ctx.fillStyle="#238b5c";
        ctx.beginPath();
        ctx.arc(side*18,-20,17,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(side*18,-21,11,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#243b4d";
        ctx.beginPath();
        ctx.arc(side*18+2,-21,5,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(side*18+3,-24,2,0,Math.PI*2);
        ctx.fill();
    }

    // Pipi
    ctx.fillStyle="#ff9eb5";

    ctx.beginPath();
    ctx.arc(-24,4,5,0,Math.PI*2);
    ctx.arc(24,4,5,0,Math.PI*2);
    ctx.fill();

    // Senyum
    ctx.beginPath();
    ctx.arc(0,7,12,.2,Math.PI-.2);
    ctx.strokeStyle="#226044";
    ctx.lineWidth=3;
    ctx.stroke();

    // Meriam
    ctx.save();
    ctx.rotate(angle);

    ctx.fillStyle="#278b61";
    ctx.beginPath();
    ctx.roundRect(12,-10,47,20,9);
    ctx.fill();

    ctx.fillStyle="#9cf1ae";
    ctx.beginPath();
    ctx.roundRect(20,-6,33,8,5);
    ctx.fill();

    ctx.restore();
    ctx.restore();

    drawBall(frog.x,frog.y,shotColor,10);
}

// ===================================
// PARTICLES AND POPUPS
// ===================================

function drawParticles() {

    particles.forEach(p=>{

        ctx.globalAlpha=Math.max(0,p.life/p.max);
        ctx.fillStyle=p.color;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();

        ctx.globalAlpha=1;
    });
}

function drawPopups() {

    popups.forEach(p=>{

        const progress=1-p.life/p.max;
        const scale=1+Math.sin(progress*Math.PI)*.2;

        ctx.save();

        ctx.translate(p.x,p.y);
        ctx.scale(scale,scale);
        ctx.globalAlpha=Math.min(1,p.life*2);

        ctx.textAlign="center";
        ctx.font="bold 35px Fredoka";

        ctx.lineWidth=7;
        ctx.strokeStyle="white";
        ctx.strokeText(p.text,0,0);

        ctx.fillStyle="#ff5790";
        ctx.fillText(p.text,0,0);

        ctx.restore();
    });
}

// ===================================
// OVERLAY
// ===================================

function drawOverlay(title,subtitle) {

    ctx.fillStyle="#263d4d88";
    ctx.fillRect(0,0,W,H);

    ctx.textAlign="center";
    ctx.fillStyle="white";

    ctx.font="bold 54px Fredoka";
    ctx.shadowColor="#555";
    ctx.shadowBlur=12;

    ctx.fillText(title,W/2,H/2-30);

    ctx.font="bold 24px Fredoka";
    ctx.fillText(subtitle,W/2,H/2+25);

    ctx.font="18px Fredoka";
    ctx.fillText(
        "Klik tombol ULANGI untuk bermain lagi",
        W/2,H/2+75
    );

    ctx.shadowBlur=0;
}

// ===================================
// DRAW
// ===================================

function draw() {

    drawBackground();
    drawPath();

    balls.forEach(b=>{
        const p=positionAt(b.d);
        drawBall(p.x,p.y,b.color);
    });

    bullets.forEach(b=>{
        drawBall(b.x,b.y,b.color,11);
    });

    drawParticles();
    drawFrog();
    drawPopups();

    if(!running && !paused && !gameOver && !won) {
        drawOverlay("🐸 BUBBLE POP!","Tekan MULAI GAME untuk bermain");
    }

    if(paused) {
        drawOverlay("⏸ PAUSE","Permainan sedang dijeda");
    }

    if(gameOver) {
        drawOverlay("GAME OVER!","Ayo coba lagi!");
    }

    if(won) {
        drawOverlay("🏆 AMAZING!","Kamu berhasil menyelesaikan semua level!");
    }
}

// ===================================
// MAIN LOOP
// ===================================

function loop(time) {

    const dt=Math.min((time-lastTime)/1000,.04);

    lastTime=time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

createPath();
updateStats();
draw();

requestAnimationFrame(loop);

</script>
